appId: com.clipforge.app
productName: ClipForge
copyright: ClipForge

directories:
  output: release
  buildResources: resources

# ClipForge is not published to an update server, and there is no git remote to infer
# one from. Without this, electron-builder still tries to generate update metadata and
# fails with "Cannot read properties of null (reading 'channel')" after the installer is built.
publish: null

# Reuse the Electron build that npm already installed instead of letting
# electron-builder download a second ~120 MB copy into its own cache.
# Requires node_modules/electron/dist (run `node scripts/repair-electron.mjs`).
electronDist: node_modules/electron/dist

files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# ffmpeg, ffprobe, yt-dlp and gifski are shipped inside the installer so the
# installed app needs no first-run download. Populate via `npm run prepare:binaries`.
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
  # The AI weights and the ONNX runtime's wasm. Shipping them is what makes AI
  # watermark removal work offline on the first export; populate via
  # `npm run prepare:binaries`.
  - from: resources/models
    to: models
    filter:
      - '**/*'
  - from: resources/ort
    to: ort
    filter:
      - '**/*'
  # Packaged window/taskbar icon. The exe carries the .ico already, but the
  # BrowserWindow needs a real image file at runtime.
  - from: build/icon.png
    to: icon.png

# Generated by `npm run make:icon` (scripts/make-icon.mjs). Kept explicit because
# buildResources points at resources/, which holds the media binaries.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  # Per-user rather than per-machine, so updates stop asking for administrator rights.
  #
  # `perMachine: true` put the app in `Program Files`, and electron-updater cannot write
  # there as an ordinary user, so every single update raised UAC through its `elevate.exe`
  # helper. Per-user installs into `%LOCALAPPDATA%\Programs`, which the updater can replace
  # silently.
  #
  # The cost is a one-time migration: an upgrade cannot move an installation that already
  # exists, so a machine updated from an older version keeps the old copy as well. The app
  # notices that on startup and offers to run the old copy's own uninstaller - see
  # `src/shared/leftovers.ts`.
  perMachine: false
  # Kept available because that cleanup does need administrator rights, and it is the old
  # uninstaller that asks for them.
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClipForge
  artifactName: ClipForge-Setup-${version}.exe
  deleteAppDataOnUninstall: false
